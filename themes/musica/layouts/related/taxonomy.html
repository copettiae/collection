{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  <div class="listMedia">
  {{ range .Pages }}
    {{ $img := index $.Site.Data.related .LinkTitle }}
    <a class="mediaItem relatedItem" href="{{ .RelPermalink }}">
      {{ with $img }}<img src="{{ relURL (printf "img/%s" .) }}" alt="">{{ end }}
      <span>{{ .LinkTitle }} ({{ len .Pages }})</span>
    </a>
  {{ end }}
  </div>
{{ end }}
