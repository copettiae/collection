{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  <div class="listYear">
  {{ range .Pages }}
    {{ $img := index $.Site.Data.related .LinkTitle }}
    <a class="yearItem" href="{{ .RelPermalink }}">
      {{ with $img }}<img src="{{ relURL (printf "img/%s" .) }}" alt="">{{ end }}
      <span class="yearTitle">{{ .LinkTitle }}</span>
      <span class="yearSubtitle">{{ len .Pages }} item{{ if ne (len .Pages) 1 }}s{{ end }}</span>
    </a>
  {{ end }}
  </div>
{{ end }}
